# Weights & Biases configuration
WANDB_MODE: "online" # Change to "online" for logging and include appropriate ENTITY and PROJECT arguments
ENTITY: ""
PROJECT: ""
RUN_NAME: "RUN-Seperate-IPPO-RNN-Option2-TradeRewardOutsideStarterRoom"  # Optional run name. Run files go to <OUTPUT_DIR or .>/<RUN_NAME>/<timestamp>_<wandb_run_id>/
DESCRIPTION: "Option 2: baseline Food2All/ForagerCap18/Passives1p25x/Predators0p5x setup, but food/drink trade rewards only pay when both traders are outside their own starter rooms."
OUTPUT_DIR: ""  # Optional artifact root. Run files go to <OUTPUT_DIR or .>/<RUN_NAME>/<timestamp>_<wandb_run_id>/

# Environment configuration

ENV_NAME: "Craftax-Coop-Symbolic" # Can be changed to "Craftax-Coop-Symbolic", "Craftax-Coop-Pixels", "Craftax-MA-Symbolic", "Craftax-MA-Pixels"
MAX_PASSIVE_MOBS: 131  # Maximum number of passive mobs allocated/spawnable
MAX_MELEE_MOBS: 20  # 50% of the default melee predator cap
MAX_RANGED_MOBS: 0  # Maximum number of ranged predator mobs allocated/spawnable

DISABLE_REVIVE: false
REVIVING_COOLDOWN_STEPS: 50
ACTION_MASK_WHILE_DEAD: true

SHARED_REWARD: true

TEAMMATE_ALIVE_BONUS: 0.05
ALL_TEAM_ALIVE_BONUS: 0.2
DEAD_SELF_PENALTY_WEIGHT: 0.2 #individual penalty - does not affect shared reward
ONE_TIME_DEATH_PENALTY_SHARED: 0.0
ONE_TIME_DEATH_PENALTY_INDIVIDUAL: 0.0
WARRIOR_MELEE_KILL_REWARD: 7.5
FORAGER_MELEE_KILL_REWARD: 0.0  # Bonus given to foragers per credited melee predator kill
WARRIOR_PASSIVE_FOOD_GAIN: 2  # Food gained by a warrior when eating a killed passive mob
FORAGER_PASSIVE_FOOD_GAIN: 2  # Food gained by a forager when eating a killed passive mob
FORAGER_FOOD_CAPACITY: 18  # Maximum food capacity for foragers
FORAGER_TO_WARRIOR_FOOD_TRADE_REWARD: 1.0
FORAGER_TO_WARRIOR_DRINK_TRADE_REWARD: 1.0

TRADE_REWARD_REQUIRES_BOTH_OUTSIDE_STARTER_ROOM: true  # Only reward food/drink trades when both traders are outside their own starter rooms

ENABLE_AUTO_RESPAWNING: false
AUTO_RESPAWN_STEPS: 50
RESTRICT_AUTO_RESPAWNING_TO_SPAWN_ROOM: true
INITIAL_PREDATORS_SPAWN_IN_WARRIOR_ROOMS_ONLY: false  # Keep baseline t=0 predator sampling across all active start rooms

TRADE_RADIUS: 15
TRADE_RADIUS_SHAPE: "circle"  # "square" or "circle"

EARLY_EPISODE_CAP: 3000          # Max episode length during early training (0 = disabled)
EARLY_EPISODE_CAP_UNTIL: 25000   # Training update step until which the cap applies
GENERAL_EPISODE_CAP: 9000        # Max episode length after early cap ends (0 = use env default)
TERMINATE_ON_ANY_DEATH: false
TERMINATE_ON_ANY_DEATH_OFFSET: 800

NUM_TEAMS: 1
TEAM_COMPOSITION: [2, 2, 2]  # [FORAGER, FORAGER, WARRIOR] # Specialization values: FORAGER=1, WARRIOR=2, MINER=3
USE_REDUCED_ACTION_SPACE: true  # If true, use actions 0-24 plus team-local GIVE target actions

# Model parameters
ALG_NAME: "ippo-rnn"
GRU_HIDDEN_DIM: 512
FC_DIM_SIZE: 128
ACTIVATION: "tanh"

# Training parameters
TOTAL_TIMESTEPS: 2000000000
NUM_ENVS: 512
NUM_STEPS: 64
NUM_MINIBATCHES: 8
UPDATE_EPOCHS: 4
GAE_LAMBDA: 0.8
GAMMA: 0.99
CLIP_EPS: 0.2
SCALE_CLIP_EPS: false
ENT_COEF: 0.01
VF_COEF: 0.5
AUX_COEF: 0.1
USE_TEAMMATE_AUXILIARY_LOSS: false
AUX_TEAMMATE_WEIGHT: 0.3333
ANNEAL_LR: true
LR: 0.0002
MAX_GRAD_NORM: 1.0
LR_WARMUP: 0.0
REW_SHAPING_HORIZON: 1000000

# Seed configuration
NUM_SEEDS: 1 #careful with this > 1 - might break something in the logging code
SEED: 0

# Logging configuration
LOGGING_UPDATES_INTERVAL: 4000  # Number of updates between logging phases
LOGGING_NUM_CALLS: 20          # Number of logging_step calls per phase
LOGGING_STEPS_PER_CALL: 1024  # Number of env steps per logging_step call
LOGGING_THREADS: 1            # Number of env threads to log

# Video recording parameters
SAVE_VIDEO: true             # Whether to record and save videos during logging
VIDEO_LENGTH: 1000  # Number of env steps per video (rollout continues from current state)
VIDEO_PIXEL_SIZE: 16  # Pixel size for rendering (7=agent, 16=medium, 64=large)
SAVE_HIDDEN_STATES: false     # Whether to save hidden state CSVs during logging (large files!)
